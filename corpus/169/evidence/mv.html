k<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Spider-Verse Nexus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #0a0a0f, #1b1b2f, #0f0f1f);
            color: #f0f0f0;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #ff003c, #ff8e00);
            padding: 25px;
            font-size: 2.2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px #ff003c;
            letter-spacing: 2px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 10px #ff003c; }
            50% { text-shadow: 0 0 30px #ff8e00; }
        }

        nav {
            margin: 20px auto;
            padding: 15px;
        }

        nav a {
            margin: 0 20px;
            padding: 10px 20px;
            background: rgba(255, 0, 60, 0.2);
            border: 2px solid #ff003c;
            border-radius: 12px;
            text-decoration: none;
            color: #f0f0f0;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #ff003c;
            color: black;
            box-shadow: 0 0 15px #ff003c;
        }

        section {
            margin: 30px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            width: 65%;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            font-size: 0.9em;
            background: linear-gradient(135deg, #ff003c, #ff8e00);
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px black;
        }
    </style>
</head>
<body>
    <header>
        🕸️ Spider-Verse Nexus 2099 🕷️
    </header>
    <nav>
        <a href="?page=heroes">Héroes</a>
        <a href="?page=multiverse">Multiverso</a>
        <a href="?page=contact">Contacto</a>
    </nav>
    <section>
        <h2>🕸️ Panel del Multiverso</h2>
<p>Accede al núcleo del Spider-Verse para explorar otras dimensiones.</p>

<!-- Hint oculto: Algunas vulnerabilidades pueden estar camufladas en caracteres codificados o comentarios. -->


<form method="post" style="margin-top:20px;">
    <input type="text" name="username" placeholder="Usuario" required style="padding:8px; border-radius:5px; border:none; margin-right:10px;">
    <input type="password" name="password" placeholder="Contraseña" required style="padding:8px; border-radius:5px; border:none; margin-right:10px;">
    <button type="submit" name="login" style="padding:8px 15px; border-radius:5px; border:none; background:#ff003c; color:white; cursor:pointer;">Login</button>
</form>

<style>
    h2 {
        color: #ff8e00;
        text-shadow: 0 0 10px #ff003c;
    }
    p {
        color: #f0f0f0;
        font-size: 1em;
    }
    form {
        background: rgba(255, 0, 60, 0.1);
        padding: 20px;
        border-radius: 15px;
        width: 50%;
        margin: 20px auto;
        box-shadow: 0 0 20px rgba(255,0,60,0.3);
    }
</style>

    <footer>

</body>
</html>
