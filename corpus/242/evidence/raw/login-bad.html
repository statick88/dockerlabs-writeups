<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/">WorkConnect</a></div>
        <div class="nav-links">
            <a href="/login" class="nav-btn btn-ghost">Iniciar Sesión</a>
            <a href="/register" class="nav-btn btn-primary">Regístrate</a>
        </div>
    </nav>
    <main>
        
<div class="auth-container">
    <h2>Bienvenido de nuevo</h2>
    <p class="subtitle">Inicia sesión para continuar a WorkConnect</p>

    
    <div class="alert alert-error">
        DNI o contraseña incorrectos.
    </div>
    

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="dni">Documento de Identidad (DNI)</label>
            <input type="text" id="dni" name="dni" required placeholder="71902....">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        ¿No tienes cuenta? <a href="/register" style="color: var(--primary); text-decoration: none;">Regístrate</a>
    </p>
</div>

    </main>
</body>
</html>
